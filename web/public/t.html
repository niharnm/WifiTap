<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Wi-Fi Card</title>
  <style>
    :root {
      --bg: #0a0d12;
      --text: #f2f5f8;
      --muted: #9ea6b0;
      --accent: #00d6f0;
      --panel: #1f1f1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
    }
    main { max-width: 420px; width: 100%; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    section {
      background: var(--panel);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    h2 { font-size: 17px; margin: 0 0 6px; color: var(--accent); }
    section p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Wi-Fi Card</h1>
    <p>This card shares a Wi-Fi network. Hold your phone to the card to join.</p>
    <section>
      <h2>iPhone</h2>
      <p>Tap the notification that appears, then tap Open and Join.</p>
    </section>
    <section>
      <h2>Android</h2>
      <p>Hold the back of your phone to the card and tap Connect when asked.</p>
    </section>
    <p>If nothing happens, ask your host for the network name and password.</p>
  </main>
</body>
</html>
